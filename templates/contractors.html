<!doctype html><html><head><meta charset="utf-8"><title>Подрядчики</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="container"><a href="/">← Главная</a><h1>База подрядчиков</h1>
<div class="grid"><div><h3>Подрядчики</h3><form method="post" action="{{ url_for('create_contractor') }}"><input name="name" placeholder="Название подрядчика" required><button>Добавить</button></form><ul>{% for c in contractors %}<li>{{ c.name }}</li>{% endfor %}</ul></div>
<div><h3>Работы подрядчиков</h3><form method="post" action="{{ url_for('create_contractor_work') }}"><select name="contractor_id">{% for c in contractors %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="name" placeholder="Работа" required><input name="unit" placeholder="Ед." required><input name="default_price" placeholder="Цена"><button>Добавить</button></form>
<table><tr><th>Подрядчик</th><th>Работа</th><th>Ед.</th><th>Цена</th></tr>{% for w in works %}<tr><td>{{w.contractor_name}}</td><td>{{w.name}}</td><td>{{w.unit}}</td><td>{{w.default_price}}</td></tr>{% endfor %}</table></div></div></div></body></html>
