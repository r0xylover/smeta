<!doctype html><html><head><meta charset="utf-8"><title>Материалы</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><div class="container"><a href="/">← Главная</a><h1>База материалов</h1>
<form method="post" action="{{ url_for('create_material_base') }}"><select name="category"><option value="rough">Черновые</option><option value="finish">Чистовые</option><option value="electric">Электрика</option></select><input name="name" placeholder="Материал" required><input name="unit" placeholder="Ед." required><input name="default_price" placeholder="Цена"><button>Добавить</button></form>
<table><tr><th>Категория</th><th>Название</th><th>Ед.</th><th>Цена</th></tr>{% for m in materials %}<tr><td>{{m.category}}</td><td>{{m.name}}</td><td>{{m.unit}}</td><td>{{m.default_price}}</td></tr>{% endfor %}</table></div></body></html>
